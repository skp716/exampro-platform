<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookesh Student Gateway</title><style>
:root{--primary:#155eef;--secondary:#081a37;--ink:#13213a;--muted:#64748b;--line:#dce4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--primary) 55%,transparent),transparent 35%),linear-gradient(145deg,var(--secondary),#06142d);display:grid;place-items:center;padding:22px}button,input,select{font:inherit}.card{width:min(650px,100%);background:#fff;border-radius:22px;box-shadow:0 28px 80px #0005;overflow:hidden}.head{padding:27px 30px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:flex;gap:15px;align-items:center}.logo{width:62px;height:62px;border-radius:14px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:900;overflow:hidden;flex:0 0 62px}.logo img{width:100%;height:100%;object-fit:contain}.head h1{font-size:1.3rem;margin:0}.head p{margin:5px 0 0;color:#e2ebff;font-size:.82rem}.body{padding:30px}.body h2{margin:0 0 7px}.lead{color:var(--muted);font-size:.9rem;margin:0 0 22px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:.8rem;font-weight:800}.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}.primary,.secondary{border:0;border-radius:10px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff;width:100%}.secondary{background:#eaf1fb;color:#203858}.error{padding:11px;border-radius:9px;background:#fff0f0;color:#a12626;border:1px solid #ffcaca;margin-bottom:15px;font-size:.82rem}.hidden{display:none!important}.buttons{display:flex;gap:10px}.buttons .primary{flex:1}.loading{color:#fff;font-weight:700}.footer{text-align:center;color:var(--muted);font-size:.72rem;padding:0 30px 22px}.step-label{font-size:.72rem;color:var(--primary);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}@media(max-width:560px){body{padding:12px}.head,.body{padding:22px 18px}.buttons{flex-direction:column-reverse}}
</style></head><body><div class="loading" id="loading">Preparing secure institute access…</div><main class="card hidden" id="card"><header class="head"><div class="logo" id="logo"><img src="bookesh-logo.png" alt="Bookesh logo"></div><div><h1 id="institute-name">Bookesh Examination Gateway</h1><p id="institute-meta">Secure multi-institute examination access</p></div></header>
<section class="body" id="code-step"><div class="step-label">Step 1 of 3</div><h2>Enter Examination Code</h2><p class="lead">Enter the code provided by your institute.</p><div class="error hidden" id="code-error"></div><form id="code-form"><div class="field"><label>Examination Code *</label><input id="code" autocomplete="off" maxlength="30" required placeholder="Example: ACC100"></div><button class="primary">Continue</button></form></section>
<section class="body hidden" id="profile-step"><div class="step-label">Step 2 of 3</div><h2>Candidate Details</h2><p class="lead">Your exam will open with this institute's settings.</p><div class="error hidden" id="profile-error"></div><form id="profile-form"><div class="field"><label>Full Name *</label><input name="name" required placeholder="Enter your full name"></div><div class="field"><label>Gmail Address *</label><input name="email" type="email" required placeholder="example@gmail.com"></div><div class="field"><label>Exam Category *</label><select name="examId" id="exam-category" required><option value="">Select Exam Category</option></select></div><div class="buttons"><button class="secondary" id="back" type="button">Back</button><button class="primary">Continue to Instructions</button></div></form></section><footer class="footer" id="footer">Powered by Bookesh</footer></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';import{getFirestore,doc,getDoc,getDocs,collection}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';import{getAuth,onAuthStateChanged,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyCeGPesXxNBWNdiJH6XYpuJAi9U5JMwvOc',authDomain:'test-d6ee6.firebaseapp.com',projectId:'test-d6ee6',storageBucket:'test-d6ee6.firebasestorage.app',messagingSenderId:'533839027531',appId:'1:533839027531:web:98417498dc648e54695cce'},app=initializeApp(cfg),db=getFirestore(app),auth=getAuth(app),$=s=>document.querySelector(s);let institute=null,settings={},exams=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function error(id,message){const el=$(id);el.textContent=message;el.classList.remove('hidden')}function step(id){['#code-step','#profile-step'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}async function ensureAuth(){if(auth.currentUser)return auth.currentUser;return new Promise((resolve,reject)=>{const stop=onAuthStateChanged(auth,async u=>{if(u){stop();resolve(u);return}try{const c=await signInAnonymously(auth);stop();resolve(c.user)}catch(e){stop();reject(e)}},reject)})}
function normalizeCode(v){return v.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'')}function applyBrand(){const brand=institute.branding||{};document.documentElement.style.setProperty('--primary',brand.primaryColor||'#155eef');document.documentElement.style.setProperty('--secondary',brand.secondaryColor||'#081a37');$('#institute-name').textContent=settings.instituteName||institute.instituteName||'Institute Examination';$('#institute-meta').textContent=[settings.location||institute.address?.city,institute.instituteType==='school'?'School Examination':'Competitive Examination'].filter(Boolean).join(' • ');$('#footer').textContent=brand.footerText||'Powered by Bookesh';const logo=brand.logoUrl||institute.logoUrl||settings.logoUrl;if(logo)$('#logo').innerHTML=`<img src="${esc(logo)}" alt="Institute logo">`}
async function resolveInstitute(code){await ensureAuth();const codeSnap=await getDoc(doc(db,'institute_codes',normalizeCode(code)));if(!codeSnap.exists())throw Error('Invalid Examination Code. Check the code and try again.');const instituteSnap=await getDoc(doc(db,'institutes',codeSnap.data().instituteId));if(!instituteSnap.exists())throw Error('Institute configuration is missing.');const data={id:instituteSnap.id,...instituteSnap.data()};if(data.status!=='active')throw Error('This institute is currently inactive.');const [settingSnap,examSnap]=await Promise.all([getDoc(doc(db,'institutes',data.id,'settings','exam_config')),getDocs(collection(db,'institutes',data.id,'exams'))]);settings=settingSnap.exists()?settingSnap.data():{};exams=examSnap.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.active===true);if(!exams.length)throw Error('No active exam is configured for this institute.');return data}
function renderExams(){$('#exam-category').innerHTML='<option value="">Select Exam Category</option>'+exams.map(e=>`<option value="${esc(e.id)}">${esc(e.name||e.examName||e.id)}</option>`).join('')}
$('#code-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('#code-error').classList.add('hidden');try{institute=await resolveInstitute($('#code').value);applyBrand();renderExams();step('#profile-step')}catch(err){const c=String(err.code||'');error('#code-error',c.includes('permission-denied')?'Database permission denied. Publish the latest Firestore rules.':err.message)}finally{b.disabled=false}};
$('#profile-form').onsubmit=e=>{e.preventDefault();$('#profile-error').classList.add('hidden');const profile=Object.fromEntries(new FormData(e.currentTarget).entries()),email=String(profile.email||'').trim().toLowerCase(),exam=exams.find(x=>x.id===profile.examId);if(!profile.name.trim()||!email.endsWith('@gmail.com')||!exam){error('#profile-error','Enter full name, valid Gmail address and select an exam category.');return}profile.name=profile.name.trim();profile.email=email;profile.examName=exam.name||exam.id;profile.centerCode=settings.activeCenterCode||$('#code').value.trim().toUpperCase();sessionStorage.setItem('bookeshInstitute',JSON.stringify(institute));sessionStorage.setItem('bookeshStudentProfile',JSON.stringify(profile));sessionStorage.setItem('bookeshTenantExams',JSON.stringify(exams.map(x=>({...x,tenant:true}))));sessionStorage.setItem('bookeshGatewayReady','1');location.href='index.html?gateway=1'};$('#back').onclick=()=>step('#code-step');
ensureAuth().then(()=>{$('#loading').classList.add('hidden');$('#card').classList.remove('hidden');const params=new URLSearchParams(location.search),q=params.get('code');if(params.get('error')==='verification')error('#code-error','Candidate verification failed. Check the active center code and Firestore rules, then try again.');if(q){$('#code').value=q;$('#code-form').requestSubmit()}}).catch(e=>{$('#loading').textContent=`Authentication failed: ${e.message}`});
</script></body></html>
