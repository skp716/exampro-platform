name: Verify exam portals
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix tests install
      - run: npm --prefix tests test
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npm --prefix tests run browser
      - if: ${{ !cancelled() }}
        run: npm --prefix tests run rules
