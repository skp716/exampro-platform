<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookesh — Platform Governance</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#081a37;--blue:#155eef;--ink:#14213a;--muted:#64748b;--line:#dce4f0;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.top{height:70px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:17px 0}.card,.panel{background:#fff;border:1px solid #e5ebf4;border-radius:14px;padding:18px}.card span{font-size:.72rem;color:var(--muted);font-weight:700}.card strong{display:block;font-size:1.5rem;margin-top:8px}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.tabs button.active{background:var(--blue);color:#fff}.panel{display:none}.panel.active{display:block}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{text-align:left;font-size:.68rem;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}td{font-size:.78rem;padding:11px 10px;border-bottom:1px solid #edf1f7}.status{padding:5px 8px;border-radius:20px;background:#ddf6ea;color:#08714a;font-weight:800;font-size:.67rem}.status.off{background:#feecec;color:#b42318}.primary{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 12px;font-weight:700}.field{display:grid;gap:6px}.field label{font-size:.75rem;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px}.logo{width:40px;height:40px;object-fit:contain;border-radius:7px;border:1px solid var(--line)}.error{padding:12px;background:#fff0f0;color:#a12626;border-radius:9px}@media(max-width:750px){.wrap{padding:14px}.cards{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.top{padding:0 14px}}</style></head><body><div id="loading" style="min-height:100vh;display:grid;place-items:center">Verifying access…</div><div class="hidden" id="app"><header class="top"><a href="super-admin.html">← Super Admin</a><b>Platform Governance</b><button class="primary" id="logout">Sign out</button></header><main class="wrap"><div class="head"><div><h1>Plans, Health & Audit</h1><p>Platform-level institute governance without student data.</p></div></div><section class="cards"><div class="card"><span>Institutes</span><strong id="total">0</strong></div><div class="card"><span>Healthy Portals</span><strong id="healthy">0</strong></div><div class="card"><span>Expiring Plans</span><strong id="expiring">0</strong></div><div class="card"><span>Security Alerts</span><strong id="alerts">0</strong></div></section><nav class="tabs"><button class="active" data-tab="health">Institute Health</button><button data-tab="audit">Audit Logs</button></nav><section class="panel active" id="health"><div class="table"><table><thead><tr><th>Institute</th><th>Logo</th><th>Plan</th><th>Expiry</th><th>Configuration</th><th>Security</th><th>Portal</th><th>Save</th></tr></thead><tbody id="health-rows"></tbody></table></div></section><section class="panel" id="audit"><div class="table"><table><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Institute</th><th>Actor</th></tr></thead><tbody id="audit-rows"></tbody></table></div></section><div class="error hidden" id="error"></div></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';import{getFirestore,doc,getDoc,setDoc,collection,onSnapshot,query,orderBy,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';import{getAuth,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.0.0/firebase-storage.js';const cfg={apiKey:'AIzaSyCeGPesXxNBWNdiJH6XYpuJAi9U5JMwvOc',authDomain:'test-d6ee6.firebaseapp.com',projectId:'test-d6ee6',storageBucket:'test-d6ee6.firebasestorage.app',messagingSenderId:'533839027531',appId:'1:533839027531:web:98417498dc648e54695cce'},app=initializeApp(cfg,'bookesh-admin'),db=getFirestore(app),auth=getAuth(app),storage=getStorage(app),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let admin,institutes=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));$('#logout').onclick=()=>signOut(auth);$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});function render(){const now=Date.now(),month=30*864e5;$('#total').textContent=institutes.length;$('#healthy').textContent=institutes.filter(x=>x.status==='active'&&x.configurationVersion).length;$('#expiring').textContent=institutes.filter(x=>{const t=x.subscription?.expiresAt?.toMillis?.()||new Date(x.subscription?.expiresAt||0).getTime();return t>now&&t-now<month}).length;$('#alerts').textContent=institutes.filter(x=>x.status==='suspended'||!x.security?.preset).length;$('#health-rows').innerHTML=institutes.map(x=>`<tr data-id="${x.id}"><td><b>${esc(x.instituteName)}</b><br>${esc(x.instituteCode)}</td><td>${x.branding?.logoUrl?`<img class="logo" src="${esc(x.branding.logoUrl)}">`:''}<input type="file" data-logo accept="image/png,image/jpeg,image/webp" style="width:120px"></td><td><select data-plan><option ${x.subscription?.plan==='starter'?'selected':''}>starter</option><option ${x.subscription?.plan==='growth'?'selected':''}>growth</option><option ${x.subscription?.plan==='enterprise'?'selected':''}>enterprise</option></select></td><td><input data-expiry type="date" value="${x.subscription?.expiresAt?.toDate?x.subscription.expiresAt.toDate().toISOString().slice(0,10):String(x.subscription?.expiresAt||'').slice(0,10)}"></td><td>v${x.configurationVersion||1}</td><td>${esc((x.security?.preset||'missing').toUpperCase())}</td><td><span class="status ${x.status==='active'?'':'off'}">${esc((x.status||'inactive').toUpperCase())}</span></td><td><button class="primary" data-save>Save</button></td></tr>`).join('');$$('[data-save]').forEach(b=>b.onclick=()=>saveRow(b.closest('tr')))}async function saveRow(row){const id=row.dataset.id,item=institutes.find(x=>x.id===id),button=row.querySelector('[data-save]');button.disabled=true;try{let logoUrl=item.branding?.logoUrl||'',file=row.querySelector('[data-logo]').files[0];if(file){if(file.size>2*1024*1024)throw Error('Logo must be below 2 MB.');const path=ref(storage,`institute-logos/${id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`);await uploadBytes(path,file,{contentType:file.type});logoUrl=await getDownloadURL(path)}const update={subscription:{plan:row.querySelector('[data-plan]').value,expiresAt:row.querySelector('[data-expiry]').value,status:'active'},branding:{...(item.branding||{}),logoUrl},updatedAt:serverTimestamp(),updatedBy:admin.uid};await setDoc(doc(db,'institutes',id),update,{merge:true});toast('Saved')}catch(e){alert(e.message)}finally{button.disabled=false}}function toast(v){console.log(v)}onAuthStateChanged(auth,async u=>{if(!u){location.href='super-admin.html';return}try{const a=await getDoc(doc(db,'admins',u.uid));if(!a.exists()||a.data().active!==true||a.data().role!=='super_admin')throw Error('Super Admin required.');admin={uid:u.uid,email:u.email};onSnapshot(collection(db,'institutes'),s=>{institutes=s.docs.map(d=>({id:d.id,...d.data()}));render()});onSnapshot(query(collection(db,'audit_logs'),orderBy('timestamp','desc'),limit(200)),s=>{$('#audit-rows').innerHTML=s.docs.map(d=>{const x=d.data();return`<tr><td>${x.timestamp?.toDate?x.timestamp.toDate().toLocaleString():'—'}</td><td>${esc(String(x.action||'').replaceAll('_',' '))}</td><td>${esc(x.targetName||x.targetId)}</td><td>${esc(x.instituteId||'Platform')}</td><td>${esc(x.actorEmail||x.actorUid)}</td></tr>`}).join('')});$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');if(location.hash==='#audit')$$('[data-tab="audit"]')[0].click()}catch(e){$('#loading').textContent=e.message}});</script></body></html>
