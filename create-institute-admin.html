<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Institute Admin · Bookesh</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#071d3b;color:#10213d;min-height:100vh;display:grid;place-items:center}.card{width:min(760px,94vw);background:#fff;border-radius:24px;padding:32px}h1{margin:0}p{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}button,a{padding:13px 18px;border-radius:11px;border:0;font-weight:800;text-decoration:none}.primary{background:#1769ee;color:#fff}.back{background:#eaf1fb;color:#17345c}.actions{display:flex;justify-content:space-between;margin-top:22px}.message{padding:12px;border-radius:10px;margin:16px 0;background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.hidden{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="card"><h1>Create Institute Admin</h1><p>Authentication login और authorization profile एक secure server operation में बनेंगे।</p><div id="message" class="message hidden"></div><form id="form"><div class="grid"><div><label>Name *</label><input name="name" required></div><div><label>Email *</label><input name="email" type="email" required></div><div><label>Password *</label><input name="password" type="password" minlength="8" required></div><div><label>Phone (+91…)</label><input name="phone"></div><div class="full"><label>Active Institute *</label><select name="instituteId" id="institute" required><option value="">Loading…</option></select></div></div><div class="actions"><a class="back" href="super-admin.html#admins">Back</a><button class="primary" id="save">Create secure login</button></div></form></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,getDoc,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),fn=getFunctions(app,'asia-south1'),form=document.querySelector('#form'),message=document.querySelector('#message'),select=document.querySelector('#institute'),save=document.querySelector('#save');const show=(text,ok=false)=>{message.textContent=text;message.className=`message ${ok?'success':''}`};onAuthStateChanged(auth,async user=>{if(!user)return location.replace('super-admin.html');const p=await getDoc(doc(db,'admins',user.uid));if(!p.exists()||p.data().active!==true||p.data().role!=='super_admin')return location.replace('super-admin.html');const snap=await getDocs(query(collection(db,'institutes'),where('status','==','active')));select.innerHTML='<option value="">Select institute</option>'+snap.docs.map(d=>`<option value="${d.id}">${d.data().name||d.id} (${d.data().code||'—'})</option>`).join('')});form.onsubmit=async event=>{event.preventDefault();save.disabled=true;message.classList.add('hidden');try{const data=Object.fromEntries(new FormData(form).entries()),result=await httpsCallable(fn,'createInstituteAdmin')(data);show(`Account created. UID: ${result.data.uid}`,true);form.reset()}catch(error){show(error.message||'Account could not be created.')}finally{save.disabled=false}};
</script></body></html>
